name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aurora-backend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  app-typecheck:
    name: App — TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aurora-app/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
